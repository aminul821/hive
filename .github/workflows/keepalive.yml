name: Keep Supabase awake

# Supabase pauses free-tier projects after 7 days without activity. A paused
# project is unreachable until someone restores it by hand from the dashboard.
#
# For a hackathon this is the single most likely way to lose a demo: you build
# in week one, present in week three, and the database went to sleep in
# between. This workflow touches the database every two days so that cannot
# happen.
#
# SETUP: add a repository secret named APP_URL pointing at your deployed app,
# for example https://hivetrust.onrender.com
# Repo -> Settings -> Secrets and variables -> Actions -> New repository secret

on:
  schedule:
    # 06:00 UTC on even days. Two days is a comfortable margin under seven,
    # and leaves room for a couple of consecutive failed runs.
    - cron: "0 6 */2 * *"
  workflow_dispatch:        # lets you trigger it by hand before demo day

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app so it queries Supabase
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "APP_URL secret is not set. Add it in repository settings."
            exit 1
          fi

          # /api/health runs an actual SELECT, which is what counts as
          # activity. A static page would not keep the database awake.
          url="${APP_URL%/}/api/health"
          echo "Pinging $url"

          # Free hosts spin down when idle, so the first request can take
          # close to a minute to cold-start. Retry generously.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
                        --max-time 90 "$url" || echo "000")

            if [ "$code" = "200" ]; then
              echo "OK on attempt $attempt"
              cat /tmp/body.txt
              if grep -q '"database":[[:space:]]*"down"' /tmp/body.txt; then
                echo "::error::App is up but the database is unreachable."
                exit 1
              fi
              exit 0
            fi

            echo "attempt $attempt failed (HTTP $code), retrying in 30s"
            sleep 30
          done

          echo "::error::Could not reach $url after 5 attempts."
          exit 1
