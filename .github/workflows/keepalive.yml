name: Keep Supabase awake

# Supabase pauses free-tier projects after 7 days without activity.
# The previous version pinged the deployed app, which was never deployed,
# so every run failed and the project paused anyway. This one talks to
# Supabase directly and needs no hosting.
#
# Secrets required:
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  Settings -> API -> anon public

on:
  schedule:
    - cron: "12 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase so it registers activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY is not set."
            exit 1
          fi

          url="${SUPABASE_URL%/}/rest/v1/batches?select=id&limit=1"
          echo "Querying ${SUPABASE_URL%/}/rest/v1/batches"

          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
                        --max-time 30 \
                        -H "apikey: ${SUPABASE_ANON_KEY}" \
                        -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
                        "$url" || echo "000")

            case "$code" in
              200|206)
                echo "OK on attempt $attempt - project is awake."
                exit 0
                ;;
              401|403)
                echo "Reached the database; RLS refused the read (HTTP $code)."
                echo "That still counts as activity."
                exit 0
                ;;
              404)
                echo "::error::Table 'batches' not found. Run migrate_to_db.py."
                cat /tmp/body.txt
                exit 1
                ;;
              *)
                echo "attempt $attempt failed (HTTP $code), retrying in 20s"
                cat /tmp/body.txt || true
                sleep 20
                ;;
            esac
          done

          echo "::error::Could not reach Supabase after 3 attempts."
          exit 1
